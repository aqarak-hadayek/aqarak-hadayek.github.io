<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="description" content="عقارك: شقق للإيجار والتمليك في حدايق الأهرام بالصور والفيديو وكل التفاصيل.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عقارك | شقق إيجار وتمليك في حدايق الأهرام</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a black and white listing board, single dark theme by choice.
   The only color is the champagne key tag that carries the apartment code. */
:root{
  color-scheme:dark;
  --bg:#0a0a0b;
  --surface:#141416;
  --ink:#f6f5f1;
  --muted:#a09f9a;
  --line:#2a2a2e;
  --brand:#ffffff;
  --brand-ink:#0a0a0b;
  --tag:#d9b872;
  --tag-ink:#1b1404;
  --good:#8fd6ab;
  --good-bg:#15291e;
  --warn:#e6c07a;
  --warn-bg:#2b2413;
  --font-display:"Alexandria","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --radius:14px;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.7}
a{color:inherit}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* header */
.top{background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.logo{font-family:var(--font-display);font-weight:700;font-size:1.15rem;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo::before{content:"";width:10px;height:10px;background:var(--tag);transform:rotate(45deg)}
.top .call{display:flex;align-items:center;gap:10px;font-size:.92rem}
.top .call a{background:var(--brand);color:var(--brand-ink);text-decoration:none;font-weight:600;padding:6px 14px;border-radius:999px}
.demo{background:var(--surface);color:var(--muted);border-bottom:1px solid var(--line);font-size:.88rem;text-align:center;padding:6px 16px}

/* hero */
.hero{padding:36px 0 8px}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.7rem,4.6vw,2.7rem);line-height:1.35;margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:60ch}

/* chooser */
.choose{padding:44px 0 56px}
.choose h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.8rem,5vw,2.9rem);line-height:1.35;margin:0 0 6px;text-wrap:balance}
.choose > p{margin:0 0 26px;color:var(--muted)}
.doors{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.door{display:flex;flex-direction:column;gap:8px;text-decoration:none;background:linear-gradient(160deg,var(--surface),var(--bg));border:1px solid var(--line);border-radius:20px;padding:26px 24px 22px;transition:transform .15s ease,border-color .15s ease}
.door:hover{transform:translateY(-3px);border-color:var(--tag)}
.door strong{font-family:var(--font-display);font-weight:800;font-size:2rem;line-height:1.3}
.door span{color:var(--muted)}
.door em{font-style:normal;align-self:flex-start;margin-top:10px;background:var(--brand);color:var(--brand-ink);font-weight:600;padding:8px 18px;border-radius:999px}
.door.sale em{background:var(--tag);color:var(--tag-ink)}
.switch{display:inline-block;margin-top:10px;font-weight:600;color:var(--tag)}
@media (prefers-reduced-motion:reduce){.door{transition:none}.door:hover{transform:none}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin:22px 0 10px}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);flex:1 1 150px}
.filters select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;color:var(--ink)}
.count{font-size:.92rem;color:var(--muted);margin:0 0 14px}

/* grid + card */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s ease, border-color .15s ease}
.card:hover{transform:translateY(-3px);border-color:var(--tag)}
.card .ph{aspect-ratio:4/3}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.price{color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:1.2rem;font-variant-numeric:tabular-nums}
.price small{font-family:var(--font-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.9rem;margin:0;padding:0;list-style:none}
.facts b{color:var(--ink);font-weight:600}

/* key tag (apartment code) */
.keytag{display:inline-flex;align-items:center;gap:8px;background:var(--tag);color:var(--tag-ink);font-family:var(--font-display);font-weight:700;font-size:.85rem;padding:4px 12px 4px 14px;border-radius:6px 999px 999px 6px;letter-spacing:.04em;direction:ltr}
.keytag::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.keytag.big{font-size:1rem;padding:6px 14px 6px 18px}

/* pills */
.pill{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--good-bg);color:var(--good);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}

/* placeholder photo */
.ph{position:relative;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 14% 34%),hsl(calc(var(--h) + 30) 12% 16%));color:#fff;overflow:hidden}
.ph svg{width:46%;max-width:190px;opacity:.85}
.ph span{position:absolute;inset-inline-start:10px;bottom:8px;font-size:.75rem;background:rgba(0,0,0,.45);padding:1px 9px;border-radius:999px}
.ph .vid{position:absolute;inset-inline-end:10px;top:10px;bottom:auto;inset-inline-start:auto}

/* floor diagram */
.floors{display:inline-flex;align-items:center;gap:8px;font-size:.9rem}
.floors i{display:flex;flex-direction:column-reverse;gap:2px}
.floors i u{display:block;width:22px;height:4px;border-radius:1px;background:var(--line)}
.floors i u.on{background:var(--tag)}

/* detail */
.detail{padding:22px 0 56px}
.back{display:inline-block;margin-bottom:14px;color:var(--muted);text-decoration:none;font-size:.95rem}
.back:hover{color:var(--ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:26px;align-items:start}
@media (max-width:820px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.stage{border-radius:var(--radius);aspect-ratio:4/3;width:100%;border:0;padding:0}
.thumbs{display:flex;gap:8px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.thumbs button{flex:0 0 84px;aspect-ratio:4/3;border-radius:8px;border:2px solid transparent;padding:0;cursor:pointer}
.thumbs button[aria-current="true"]{border-color:var(--tag)}
.thumbs .ph svg{width:60%}.thumbs .ph span{display:none}
.info{display:flex;flex-direction:column;gap:18px}
.info h1{font-family:var(--font-display);font-weight:700;font-size:1.5rem;line-height:1.5;margin:0;text-wrap:balance}
.info .price{font-size:1.7rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px}
.panel h2{font-family:var(--font-display);font-weight:700;font-size:.95rem;margin:12px 0 4px;color:var(--muted)}
.panel dl{margin:0}
.panel dl div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.panel dl div:first-child{border-top:0}
.panel dt{color:var(--muted)}
.panel dd{margin:0;font-weight:600;text-align:end}
.cta{display:flex;flex-direction:column;gap:6px;background:var(--brand);color:var(--brand-ink);border-radius:var(--radius);padding:16px}
.cta a{background:var(--tag);color:var(--tag-ink);text-decoration:none;text-align:center;font-family:var(--font-display);font-weight:700;padding:12px;border-radius:10px}
.cta p{margin:0;font-size:.9rem;text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:28px;text-align:center;color:var(--muted);grid-column:1/-1}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;padding:18px 0 28px}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

/* v2: patterns borrowed from listing portals */
.filters label{flex:1 1 130px}
.favtoggle{flex:0 0 auto;align-self:end;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer;color:var(--ink)}
.favtoggle[aria-pressed="true"]{border-color:var(--tag);color:var(--tag)}
.card{position:relative}
.card h3{font-family:var(--font-display);font-weight:700;font-size:1rem;line-height:1.6;margin:0}
.card h3 a{text-decoration:none}
.card h3 a::after{content:"";position:absolute;inset:0}
.card .meta{font-size:.82rem;color:var(--muted)}
.fav{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:1.15rem;line-height:1;cursor:pointer;display:grid;place-items:center}
.fav[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink)}
.fav.inline{position:static;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.fav.inline[aria-pressed="true"]{background:var(--tag);color:var(--tag-ink);border-color:var(--tag)}
.ph .cnt{position:absolute;inset-inline-end:10px;inset-inline-start:auto;bottom:8px}
.ph .vid{top:auto;bottom:8px;inset-inline-end:74px}
.gal{position:relative}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:1.2rem;cursor:pointer}
.gal .nav.prev{inset-inline-start:10px}.gal .nav.next{inset-inline-end:10px}
.gal .pos{position:absolute;top:10px;inset-inline-start:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.8rem;padding:1px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.keyfacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.keyfacts div{background:var(--surface);padding:12px 8px;text-align:center}
.keyfacts b{display:block;font-family:var(--font-display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.keyfacts span{font-size:.8rem;color:var(--muted)}
.desc{margin:0;color:var(--muted);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0 0 14px}
.chips li{border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.88rem}
.similar{margin-top:40px}
.similar h2{font-family:var(--font-display);font-weight:700;font-size:1.2rem;margin:0 0 14px}
.similar .grid{padding-bottom:0}
.stick{display:none}
@media (max-width:820px){
  .detail{padding-bottom:110px}
  .stick{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:5;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px}
  .stick .price{font-size:1.05rem}
  .stick a{background:var(--brand);color:var(--brand-ink);text-decoration:none;font-family:var(--font-display);font-weight:700;padding:10px 18px;border-radius:10px;white-space:nowrap}
}
@media (max-width:420px){.keyfacts b{font-size:1.05rem}}

/* v3: full site chrome */
html{scroll-behavior:smooth}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.top .wrap{padding-block:12px}
.nav{display:flex;gap:22px;font-size:.95rem}
.nav a{text-decoration:none;color:var(--muted);padding:4px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink);border-color:var(--tag)}
@media (max-width:720px){.nav{order:3;width:100%;justify-content:center;gap:28px}#phoneText{display:none}}
.demo{font-size:.8rem;padding:4px 16px}
.home-hero{position:relative;padding:64px 0 40px;overflow:hidden}
.home-hero .pyr{position:absolute;inset-inline-end:-40px;bottom:0;width:min(560px,70%);opacity:.5;pointer-events:none}
.eyebrow{font-size:.85rem;letter-spacing:.02em;color:var(--tag);margin:0 0 14px}
.home-hero h1{position:relative;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5.6vw,3.5rem);line-height:1.3;margin:0 0 14px;max-width:16ch;text-wrap:balance}
.home-hero .lead{position:relative;color:var(--muted);font-size:1.08rem;max-width:52ch;margin:0 0 30px}
.home-hero .doors{position:relative;max-width:760px}
.door{backdrop-filter:blur(4px)}
.stats{display:flex;flex-wrap:wrap;gap:14px 44px;margin:34px 0 0;padding:22px 0 0;border-top:1px solid var(--line);list-style:none;position:relative}
.stats b{display:block;font-family:var(--font-display);font-weight:800;font-size:1.9rem;line-height:1.2;font-variant-numeric:tabular-nums}
.stats span{color:var(--muted);font-size:.9rem}
.sec{padding:48px 0;border-top:1px solid var(--line)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 20px;margin-bottom:22px}
.sec h2{font-family:var(--font-display);font-weight:700;font-size:clamp(1.35rem,3vw,1.8rem);line-height:1.4;margin:0;text-wrap:balance}
.sec-head a{color:var(--tag);font-weight:600;font-size:.95rem}
.sec .grid{padding-bottom:0}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.why div{background:var(--surface);padding:24px 22px}
.why h3{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:0 0 6px}
.why p{margin:0;color:var(--muted);font-size:.95rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px;list-style:none;margin:0;padding:0;counter-reset:st}
.steps li{counter-increment:st;border-top:2px solid var(--tag);padding-top:14px}
.steps li::before{content:"0" counter(st);display:block;font-family:var(--font-display);font-weight:800;font-size:1.6rem;color:var(--tag);direction:ltr;text-align:end;font-variant-numeric:tabular-nums}
.steps h3{font-family:var(--font-display);font-weight:700;font-size:1.05rem;margin:4px 0}
.steps p{margin:0;color:var(--muted);font-size:.95rem}
.contact{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;background:var(--brand);color:var(--brand-ink);border-radius:20px;padding:30px 28px}
.contact h2{color:inherit}
.contact p{margin:6px 0 0;opacity:.75}
.contact .acts{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.contact .acts a{background:var(--brand-ink);color:var(--brand);text-decoration:none;font-family:var(--font-display);font-weight:700;padding:12px 24px;border-radius:999px}
.contact .acts span{font-family:var(--font-display);font-weight:700;font-size:1.15rem}
footer{padding:0;border-top:1px solid var(--line);margin-top:20px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:24px 40px;padding-block:32px}
.foot .logo{font-size:1.05rem;color:var(--ink)}
.foot p{margin:8px 0 0;max-width:38ch}
.foot nav{display:flex;flex-direction:column;gap:6px}
.foot nav a{text-decoration:none}.foot nav a:hover{color:var(--ink)}
.foot h4{font-family:var(--font-display);font-size:.85rem;color:var(--ink);margin:0 0 6px}
.legal{border-top:1px solid var(--line);padding-block:14px;font-size:.8rem}
.hero{padding:44px 0 8px}
.ph svg{opacity:.45;width:34%}

/* v4: real media */
.ph{background:#000}
.ph img,.ph video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph.stage{aspect-ratio:1/1}
.ph.stage img,.ph.stage video{object-fit:contain}
.thumbs button{position:relative;overflow:hidden;background:#000}
.thumbs button b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45);font-size:1.1rem}
.note{font-size:.85rem;color:var(--muted);margin:4px 0 0}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="#home">عقارك</a>
    <nav class="nav" aria-label="القائمة"><a href="#rent" data-nav="rent">إيجار</a><a href="#sale" data-nav="sale">تمليك</a><a href="#contact" data-nav="contact">تواصل معانا</a></nav>
    <div class="call"><span dir="ltr" id="phoneText"></span><a id="waTop" href="#home">واتساب</a></div>
  </div>
</header>
<div class="demo" id="notice" hidden></div>

<main class="wrap" id="app"></main>

<footer>
  <div class="wrap foot">
    <div><a class="logo" href="#home">عقارك</a><p id="footText"></p></div>
    <nav aria-label="روابط"><h4>الشقق</h4><a href="#rent">شقق للإيجار</a><a href="#sale">شقق تمليك</a></nav>
    <nav aria-label="تواصل"><h4>تواصل</h4><a id="waFoot" href="#contact">واتساب</a><span dir="ltr" id="phoneFoot"></span></nav>
  </div>
  <div class="wrap legal" id="legal"></div>
</footer>

<script>
// كل المحتوى بييجي من data.json، وبيتعدّل من لوحة التحكم admin.html
var SITE = {}, PHONE = "", WA = "", APTS = [];
function escAll(v){
  if (typeof v === "string") return v.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  if (Array.isArray(v)) return v.map(escAll);
  if (v && typeof v === "object") { var o = {}; Object.keys(v).forEach(function(k){ o[k] = escAll(v[k]); }); return o; }
  return v;
}
function daysOf(a){ var d = Math.floor((Date.now() - new Date(a.added + "T00:00:00").getTime()) / 86400000); return isNaN(d) || d < 0 ? 0 : d; }
function contactHtml(a){
  if (!PHONE) return '<div class="cta"><p>رقم التواصل هيتضاف قريب.' + (a ? ' احفظ كود الشقة: ' + a.code : '') + '</p></div>';
  return '<div class="cta"><a href="' + waLink(a) + '">اسأل عن الشقة دي على واتساب</a>'
    + '<p>أو اتصل على <span dir="ltr">' + PHONE + '</span> وقول الكود ' + a.code + '</p></div>';
}
var DEAL = {
  rent:{name:"إيجار", title:"شقق للإيجار في حدايق الأهرام", other:"sale", otherText:"عايز تمليك؟ شوف شقق البيع",
        caps:[["","أي سعر"],[10000,"لحد 10,000"],[15000,"لحد 15,000"],[20000,"لحد 20,000"]]},
  sale:{name:"تمليك", title:"شقق تمليك في حدايق الأهرام", other:"rent", otherText:"عايز إيجار؟ شوف شقق الإيجار",
        caps:[["","أي سعر"],[2000000,"لحد 2 مليون"],[3000000,"لحد 3 مليون"],[3500000,"لحد 3.5 مليون"]]}
};
var FLOORS = ["الأرضي","الأول","التاني","التالت","الرابع","الخامس"];
var SORTS = [["new","الأحدث"],["low","الأقل سعر"],["high","الأعلى سعر"],["big","الأكبر مساحة"]];

// ---- المحفوظات: بتتحفظ على جهاز العميل نفسه بس ----
var favs = {};
try { (JSON.parse(localStorage.getItem("hadayek-favs")) || []).forEach(function(c){ favs[c] = 1; }); } catch (e) {}
function toggleFav(code){
  if (favs[code]) delete favs[code]; else favs[code] = 1;
  try { localStorage.setItem("hadayek-favs", JSON.stringify(Object.keys(favs))); } catch (e) {}
}

function money(n){ return n.toLocaleString("en-US"); }
function slug(a){ return "apt-" + a.code.toLowerCase(); }
function priceHtml(a){ return money(a.price) + ' <small>' + (a.deal === "rent" ? "جنيه / شهر" : "جنيه") + '</small>'; }
function where(a){ return a.zone || a.gate || "حدايق الأهرام"; }
function title(a){ return a.kind + ' ' + a.area + ' متر · ' + where(a); }
function ago(d){
  if (d === 0) return "اتضافت النهارده";
  if (d === 1) return "اتضافت امبارح";
  if (d === 2) return "من يومين";
  return "من " + d + (d <= 10 ? " أيام" : " يوم");
}
function floorsHtml(f){
  var bars = "";
  for (var i = 0; i < FLOORS.length; i++) bars += '<u' + (i === f ? ' class="on"' : '') + '></u>';
  return '<span class="floors"><i aria-hidden="true">' + bars + '</i>الدور ' + FLOORS[f] + '</span>';
}
function finishPill(a){
  if (a.finish === "new") return '<span class="pill">سكن أول</span>';
  if (a.grade) return '<span class="pill plain">' + a.grade + '</span>';
  return '';
}
function waLink(a){
  var t = a ? "عايز أستفسر عن الشقة كود " + a.code + " (" + DEAL[a.deal].name + ")" : "عايز أستفسر عن شقة في حدايق الأهرام";
  return "https://wa.me/" + WA + "?text=" + encodeURIComponent(t);
}
function favBtn(a, inline){
  var on = !!favs[a.code];
  return '<button type="button" class="fav' + (inline ? " inline" : "") + '" data-fav="' + a.code + '" aria-pressed="' + on + '" aria-label="' + (on ? "شيل من المحفوظة" : "احفظ الشقة") + '">' + (on ? "♥" : "♡") + '</button>';
}
function cardHtml(a){
  return '<article class="card">'
    + '<div class="ph">' + (a.imgs[0] ? '<img src="' + a.imgs[0] + '" alt="' + title(a) + '" loading="lazy">' : '') + ''
    + (a.video ? '<span class="vid">فيديو</span>' : '') + '<span class="cnt">' + a.imgs.length + ' صور</span></div>'
    + favBtn(a)
    + '<div class="body">'
    + '<div class="row"><span class="keytag">' + a.code + '</span><span class="meta">' + ago(daysOf(a)) + '</span></div>'
    + '<div class="price">' + priceHtml(a) + '</div>'
    + '<h3><a href="#' + slug(a) + '">' + title(a) + '</a></h3>'
    + '<ul class="facts"><li><b>' + a.area + '</b> متر</li><li><b>' + a.rooms + '</b> غرف</li><li><b>' + a.baths + '</b> حمام</li></ul>'
    + '<div class="row">' + (a.floor === null ? '<span class="meta">' + (a.gate || "") + '</span>' : floorsHtml(a.floor)) + finishPill(a) + '</div>'
    + '</div></article>';
}

var state = {deal:"rent", zone:"", rooms:"", finish:"", cap:"", sort:"new", favOnly:false};
var current = null, view = "home";

function renderHome(){
  current = null; view = "home";
  function of(d){ return APTS.filter(function(a){ return a.deal === d; }); }
  var zones = {}; APTS.forEach(function(a){ if (a.zone) zones[a.zone] = 1; });
  var latest = APTS.slice().sort(function(x, y){ return daysOf(x) - daysOf(y) || (x.framed ? 1 : 0) - (y.framed ? 1 : 0) || y.imgs.length - x.imgs.length; }).slice(0, 3);
  document.getElementById("app").innerHTML =
    '<section class="home-hero">'
    + '<svg class="pyr" viewBox="0 0 560 240" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true" style="color:var(--tag)">'
    + '<path d="M0 239h560M40 239 190 60l150 179M190 60l46 179M250 239 380 96l130 143M380 96l34 143M420 239l70-78 70 78M490 161l18 78"/></svg>'
    + '<p class="eyebrow">' + SITE.eyebrow + '</p>'
    + '<h1>' + SITE.heroTitle + '</h1>'
    + '<p class="lead">' + SITE.heroLead + '</p>'
    + '<div class="doors">'
    + '<a class="door" href="#rent"><strong>إيجار</strong><span>شقق بإيجار شهري، ' + of("rent").length + ' متاحة</span><em>شوف شقق الإيجار</em></a>'
    + '<a class="door sale" href="#sale"><strong>تمليك</strong><span>شقق للبيع، ' + of("sale").length + ' متاحة</span><em>شوف شقق التمليك</em></a>'
    + '</div>'
    + '<ul class="stats"><li><b>' + of("rent").length + '</b><span>للإيجار</span></li><li><b>' + of("sale").length + '</b><span>تمليك</span></li><li><b>' + Object.keys(zones).length + '</b><span>مناطق جوه حدايق الأهرام</span></li></ul>'
    + '</section>'
    + '<section class="sec"><div class="sec-head"><h2>أحدث الشقق</h2><span><a href="#rent">كل الإيجار</a> &nbsp;·&nbsp; <a href="#sale">كل التمليك</a></span></div>'
    + '<div class="grid">' + latest.map(cardHtml).join("") + '</div></section>'
    + '<section class="sec"><div class="sec-head"><h2>كل اللي محتاج تعرفه، مكتوب في صفحة الشقة</h2></div><div class="why">'
    + '<div><h3>تفاصيل كاملة</h3><p>المساحة، الغرف، الدور، التشطيب، والعدادات المتاحة، مع صور وفيديو من جوه الشقة.</p></div>'
    + '<div><h3>كود لكل شقة</h3><p>كل شقة ليها كود واضح. قوله لنا ونعرف فوراً إنت بتسأل عن أنهي واحدة.</p></div>'
    + '<div><h3>تواصل مباشر</h3><p>زرار واتساب في كل صفحة بيبعت رسالة جاهزة فيها كود الشقة، من غير تسجيل.</p></div>'
    + '</div></section>'
    + '<section class="sec"><div class="sec-head"><h2>من الموقع للمعاينة في 3 خطوات</h2></div><ol class="steps">'
    + '<li><h3>اختار</h3><p>حدّد إيجار ولا تمليك، وفلتر بالمنطقة والسعر وعدد الغرف.</p></li>'
    + '<li><h3>ابعت الكود</h3><p>دوس على واتساب من صفحة الشقة، والكود هيتبعت لوحده.</p></li>'
    + '<li><h3>عاين</h3><p>نتفق على ميعاد وتنزل تشوف الشقة على الطبيعة.</p></li>'
    + '</ol></section>'
    + '<section class="sec" id="contact"><div class="contact"><div><h2>' + SITE.contactTitle + '</h2><p>' + SITE.contactLead + '</p></div>'
    + (PHONE ? '<div class="acts"><span dir="ltr">' + PHONE + '</span><a href="' + waLink(null) + '">كلّمنا على واتساب</a></div>' : '<div class="acts"><span>رقم التواصل هيتضاف قريب</span></div>') + '</div></section>';
}

function options(list, cur){
  return list.map(function(o){ return '<option value="' + o[0] + '"' + (String(o[0]) === String(cur) ? " selected" : "") + '>' + o[1] + '</option>'; }).join("");
}
function renderList(){
  current = null; view = "list";
  var zones = [], rooms = [], D = DEAL[state.deal];
  var ALL = APTS.filter(function(a){ return a.deal === state.deal; });
  ALL.forEach(function(a){ if (a.zone && zones.indexOf(a.zone) < 0) zones.push(a.zone); if (rooms.indexOf(a.rooms) < 0) rooms.push(a.rooms); });
  zones.sort(); rooms.sort();
  var list = ALL.filter(function(a){
    return (!state.zone || a.zone === state.zone)
        && (!state.rooms || String(a.rooms) === state.rooms)
        && (!state.finish || a.finish === state.finish)
        && (!state.cap || a.price <= +state.cap)
        && (!state.favOnly || favs[a.code]);
  });
  list.sort(function(x, y){
    if (state.sort === "low") return x.price - y.price;
    if (state.sort === "high") return y.price - x.price;
    if (state.sort === "big") return y.area - x.area;
    return daysOf(x) - daysOf(y);
  });
  var nf = ALL.filter(function(a){ return favs[a.code]; }).length;
  document.getElementById("app").innerHTML =
    '<section class="hero"><h1>' + D.title + '</h1>'
    + '<p>كل شقة بصورها وتفاصيلها: المساحة، التشطيب، العدادات، المنطقة والدور. اختار اللي يناسبك وابعتلنا كودها.</p>'
    + '<a class="switch" href="#' + D.other + '">' + D.otherText + '</a></section>'
    + '<form class="filters" id="filters">'
    + '<label for="f-zone">المنطقة<select id="f-zone" name="zone">' + options([["","كل المناطق"]].concat(zones.map(function(z){return [z,z];})), state.zone) + '</select></label>'
    + '<label for="f-rooms">عدد الغرف<select id="f-rooms" name="rooms">' + options([["","أي عدد"]].concat(rooms.map(function(r){return [r, r + " غرف"];})), state.rooms) + '</select></label>'
    + '<label for="f-cap">السعر<select id="f-cap" name="cap">' + options(D.caps, state.cap) + '</select></label>'
    + '<label for="f-finish">التشطيب<select id="f-finish" name="finish">' + options([["","الكل"],["new","سكن أول بس"]], state.finish) + '</select></label>'
    + '<label for="f-sort">الترتيب<select id="f-sort" name="sort">' + options(SORTS, state.sort) + '</select></label>'
    + '<button type="button" class="favtoggle" id="f-fav" aria-pressed="' + state.favOnly + '">♥ المحفوظة (' + nf + ')</button>'
    + '</form>'
    + '<p class="count">' + list.length + ' متاحة</p>'
    + '<div class="grid">' + (list.map(cardHtml).join("") || '<div class="empty">' + (state.favOnly ? "لسه ما حفظتش شقق. دوس على القلب اللي على أي شقة عشان ترجعلها بعدين." : "مفيش شقق بالمواصفات دي دلوقتي. جرّب تغيّر الاختيارات.") + '</div>') + '</div>';
  var form = document.getElementById("filters");
  form.addEventListener("submit", function(e){ e.preventDefault(); });
  form.addEventListener("change", function(e){
    state[e.target.name] = e.target.value;
    var id = e.target.id;
    renderList();
    var el = document.getElementById(id); if (el) el.focus();
  });
  document.getElementById("f-fav").addEventListener("click", function(){
    state.favOnly = !state.favOnly; renderList();
    document.getElementById("f-fav").focus();
  });
}

function renderDetail(a){
  current = a; view = "detail";
  var shots = a.imgs.map(function(src, i){ return {src:src, label:"صورة " + (i + 1)}; });
  if (a.video) shots.splice(1, 0, {video:a.video, src:a.imgs[0], label:"فيديو الشقة"});
  var at = 0;
  var thumbs = shots.map(function(s, i){
    return '<button type="button" data-i="' + i + '" aria-label="' + s.label + '"><img src="' + s.src + '" alt="" loading="lazy" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">' + (s.video ? '<b>▶</b>' : '') + '</button>';
  }).join("");
  function row(k, v){ return '<div><dt>' + k + '</dt><dd>' + v + '</dd></div>'; }
  var similar = APTS.filter(function(x){ return x.deal === a.deal && x !== a; }).sort(function(x, y){
    var sx = (x.zone === a.zone ? 0 : 1), sy = (y.zone === a.zone ? 0 : 1);
    return sx - sy || Math.abs(x.price - a.price) - Math.abs(y.price - a.price);
  }).slice(0, 3);
  var fin = [a.grade, a.finish === "new" ? "سكن أول" : null].filter(Boolean).join(" · ");
  var rows = row("النوع", a.kind) + (fin ? row("التشطيب", fin) : "") + (a.zone ? row("المنطقة", a.zone) : "") + (a.gate ? row("البوابة", a.gate) : "")
    + (a.floor !== null ? row("الدور", floorsHtml(a.floor)) : "") + (a.deal === "sale" ? row("سعر المتر", money(Math.round(a.price / a.area)) + " جنيه") : "");
  var meters = a.meters.length
    ? a.meters.map(function(m){ return row(m[0], '<span class="pill' + (m[2] === "warn" ? " warn" : "") + '">' + m[1] + '</span>'); }).join("")
    : row("العدادات", '<span class="pill plain">اسأل عنها على واتساب</span>');
  document.getElementById("app").innerHTML =
    '<section class="detail"><a class="back" href="#' + a.deal + '">→ رجوع لشقق ال' + DEAL[a.deal].name + '</a>'
    + '<div class="dgrid"><div>'
    + '<div class="gal"><div id="stage"></div>'
    + '<button type="button" class="nav prev" id="g-prev" aria-label="اللي قبلها">‹</button>'
    + '<button type="button" class="nav next" id="g-next" aria-label="اللي بعدها">›</button>'
    + '<span class="pos" id="g-pos" dir="ltr"></span></div>'
    + '<div class="thumbs" id="thumbs">' + thumbs + '</div>'
    + (a.framed ? '<p class="note">الصور دي لقطات من فيديو الشقة.</p>' : '')
    + '<div class="panel" style="margin-top:18px"><h2>وصف الشقة</h2><p class="desc" style="padding-bottom:14px">' + a.desc + '</p></div>'
    + '<div class="panel" style="margin-top:14px"><h2>المميزات</h2><ul class="chips">' + a.feats.map(function(f){ return '<li>' + f + '</li>'; }).join("") + '</ul></div>'
    + '</div>'
    + '<div class="info">'
    + '<div class="row" style="display:flex;gap:10px;align-items:center;justify-content:space-between">'
    + '<span style="display:flex;gap:10px;align-items:center"><span class="keytag big">' + a.code + '</span><span class="pill plain">' + DEAL[a.deal].name + '</span></span>' + favBtn(a, true) + '</div>'
    + '<h1>' + a.kind + ' ' + a.area + ' متر، ' + a.rooms + ' غرف، في ' + where(a) + '</h1>'
    + '<div><div class="price">' + priceHtml(a) + '</div>' + (a.pnote ? '<p class="note">' + a.pnote + '</p>' : '') + '<p class="note">' + ago(daysOf(a)) + '</p></div>'
    + '<div class="keyfacts"><div><b>' + a.area + '</b><span>متر</span></div><div><b>' + a.rooms + '</b><span>غرف</span></div><div><b>' + a.baths + '</b><span>حمام</span></div><div><b>' + (a.floor === null ? "—" : a.floor === 0 ? "أرضي" : a.floor) + '</b><span>الدور</span></div></div>'
    + '<div class="panel"><h2>تفاصيل الشقة</h2><dl>' + rows + '</dl></div>'
    + '<div class="panel"><h2>العدادات والنت</h2><dl>' + meters + '</dl></div>'
    + contactHtml(a)
    + '</div></div>'
    + (similar.length ? '<div class="similar"><h2>شقق مشابهة</h2><div class="grid">' + similar.map(cardHtml).join("") + '</div></div>' : '')
    + '</section>'
    + (PHONE ? '<div class="stick"><div><div class="price">' + priceHtml(a) + '</div></div><a href="' + waLink(a) + '">واتساب · ' + a.code + '</a></div>' : '');
  function show(i){
    at = (i + shots.length) % shots.length;
    var s = shots[at];
    document.getElementById("stage").innerHTML = '<div class="ph stage">' + (s.video
      ? '<video src="' + s.video + '" poster="' + s.src + '" controls playsinline preload="none"></video>'
      : '<img src="' + s.src + '" alt="' + title(a) + '، ' + s.label + '">') + '</div>';
    document.getElementById("g-pos").textContent = (at + 1) + " / " + shots.length;
    Array.prototype.forEach.call(document.getElementById("thumbs").children, function(c, k){
      if (k === at) c.setAttribute("aria-current", "true"); else c.removeAttribute("aria-current");
    });
  }
  document.getElementById("thumbs").addEventListener("click", function(e){
    var b = e.target.closest("button"); if (b) show(+b.dataset.i);
  });
  document.getElementById("g-prev").addEventListener("click", function(){ show(at - 1); });
  document.getElementById("g-next").addEventListener("click", function(){ show(at + 1); });
  show(0);
}

// القلب: حفظ الشقة
document.getElementById("app").addEventListener("click", function(e){
  var b = e.target.closest("[data-fav]"); if (!b) return;
  e.preventDefault();
  var code = b.dataset.fav;
  toggleFav(code);
  if (view !== "list") {
    var on = !!favs[code];
    Array.prototype.forEach.call(document.querySelectorAll('[data-fav="' + code + '"]'), function(x){
      x.setAttribute("aria-pressed", on); x.textContent = on ? "♥" : "♡";
      x.setAttribute("aria-label", on ? "شيل من المحفوظة" : "احفظ الشقة");
    });
  } else renderList();
});

function route(){
  var h = location.hash.replace("#", "");
  var a = APTS.filter(function(x){ return slug(x) === h; })[0];
  if (a) { renderDetail(a); window.scrollTo(0, 0); }
  else if (h === "rent" || h === "sale") {
    if (state.deal !== h) state = {deal:h, zone:"", rooms:"", finish:"", cap:"", sort:"new", favOnly:false};
    renderList(); window.scrollTo(0, 0);
  } else {
    renderHome();
    if (h === "contact") { var c = document.getElementById("contact"); if (c) c.scrollIntoView(); }
    else window.scrollTo(0, 0);
  }
  var nav = a ? a.deal : h;
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(l){
    if (l.dataset.nav === nav) l.setAttribute("aria-current", "page"); else l.removeAttribute("aria-current");
  });
}
function boot(data){
  data = escAll(data);
  SITE = data.site || {}; PHONE = (SITE.phone || "").replace(/[^0-9]/g, ""); WA = "2" + PHONE;
  APTS = (data.listings || []).filter(function(a){ return !a.hidden; });
  APTS.forEach(function(a){ a.imgs = a.imgs || []; a.feats = a.feats || []; a.meters = a.meters || []; if (a.floor === undefined) a.floor = null; });
  document.title = (SITE.name || "") + " | شقق إيجار وتمليك في حدايق الأهرام";
  Array.prototype.forEach.call(document.querySelectorAll(".logo"), function(l){ l.innerHTML = SITE.name || ""; });
  document.getElementById("footText").innerHTML = SITE.footerText || "";
  document.getElementById("legal").innerHTML = "© " + new Date().getFullYear() + " " + (SITE.name || "");
  var n = document.getElementById("notice"); if (SITE.notice) { n.innerHTML = SITE.notice; n.hidden = false; }
  document.getElementById("phoneText").textContent = PHONE;
  document.getElementById("phoneFoot").textContent = PHONE;
  document.getElementById("waTop").href = waLink(null); document.getElementById("waTop").hidden = !PHONE;
  document.getElementById("waFoot").href = PHONE ? waLink(null) : "#contact";
  window.addEventListener("hashchange", route);
  route();
}
fetch("data.json?v=" + Date.now()).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).then(boot).catch(function(){
  document.getElementById("app").innerHTML = '<div class="empty" style="margin:60px 0">الصفحة مش قادرة تحمّل بيانات الشقق دلوقتي. جرّب تعمل تحديث للصفحة.</div>';
});
</script>
</body>
</html>
