name: SEO pages
on:
  push:
    branches: [main]
    paths: [data.json, tools/build_seo.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_seo.py
      - run: |
          git config user.name "aqarak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A shaqa rent sale zones sitemap.xml robots.txt index.html
          git diff --cached --quiet || (git commit -m "تحديث صفحات SEO" && git push)
