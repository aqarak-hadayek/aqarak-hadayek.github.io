<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="description" content="عقارك: شقق للإيجار والتمليك في حدايق الأهرام بالصور والفيديو وكل التفاصيل.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>عقارك</title>
<style>
/* Product UI, not a landing page: system fonts, light surface, one brand blue,
   dense listing cards, a search box up top and an app-style tab bar on phones. */
:root{
  --bg:#f6f6f3; --surface:#ffffff; --ink:#141a21; --muted:#69727d; --line:#e6e4de;
  --brand:#12324a; --brand-ink:#ffffff; --brand-soft:#e9eff3; --accent:#9a7b3c;
  --wa:#17874a; --wa-ink:#ffffff; --heart:#d64545;
  --good:#17703f; --good-bg:#e3f4ea; --warn:#8a5a00; --warn-bg:#fdf0d5;
  --shadow:0 1px 2px rgba(20,26,33,.05),0 6px 20px rgba(20,26,33,.06);
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Geeza Pro",Tahoma,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d1013; --surface:#161a1f; --ink:#eef0f2; --muted:#98a1ab; --line:#252b32;
    --brand:#e6ebf0; --brand-ink:#0d1013; --brand-soft:#1d252e; --accent:#c9a961;
    --wa:#2fbf71; --wa-ink:#06210f; --heart:#ff6b6f;
    --good:#7ad3a0; --good-bg:#15301f; --warn:#f0c36a; --warn-bg:#35290f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d1013; --surface:#161a1f; --ink:#eef0f2; --muted:#98a1ab; --line:#252b32;
  --brand:#e6ebf0; --brand-ink:#0d1013; --brand-soft:#1d252e; --accent:#c9a961;
  --wa:#2fbf71; --wa-ink:#06210f; --heart:#ff6b6f;
  --good:#7ad3a0; --good-bg:#15301f; --warn:#f0c36a; --warn-bg:#35290f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}

/* header */
.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;gap:18px;height:56px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;color:var(--brand)}
.brand .ic{width:26px;height:26px}
.nav{display:flex;gap:4px;margin-inline-start:8px}
.nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:.93rem}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.top .sp{flex:1}
.callbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600;font-size:.9rem;direction:ltr}
.wabtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--wa);color:var(--wa-ink);border-radius:8px;padding:7px 14px;font-weight:700;font-size:.9rem;border:0;cursor:pointer}
.notice{background:var(--warn-bg);color:var(--warn);font-size:.85rem;text-align:center;padding:5px 16px}

/* search box */
.search{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin:18px 0 6px}
.search h1{font-size:1.25rem;font-weight:800;margin:0 0 12px;line-height:1.4}
.seg{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{border:0;background:transparent;padding:7px 26px;border-radius:8px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:10px;align-items:end}
@media (max-width:760px){.fields{grid-template-columns:1fr 1fr}.fields .go{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted);min-width:0}
.f select,.f input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);width:100%;font-size:.93rem}
.go{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:10px 22px;font-weight:700;cursor:pointer;text-align:center}

/* sections */
.sec{margin:26px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-size:1.1rem;font-weight:800;margin:0}
.sec-h a{color:var(--brand);font-weight:600;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.9rem;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip b{color:var(--muted);font-weight:500;margin-inline-start:4px}
.crumbs{font-size:.82rem;color:var(--muted);margin:14px 0 8px}
.crumbs a{color:var(--brand)}
.lhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;margin-bottom:10px}
.lhead h1{font-size:1.2rem;font-weight:800;margin:0}
.lhead h1 small{font-weight:500;color:var(--muted);font-size:.85rem;margin-inline-start:6px}
.fbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:14px}
.fbar select{background:var(--bg);border:1px solid transparent;border-radius:8px;padding:7px 8px;font-size:.88rem;max-width:100%}
.fbar .sp{flex:1}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:32px 16px;text-align:center;color:var(--muted);grid-column:1/-1}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
.card:hover{border-color:var(--brand)}
.media{position:relative;display:block;aspect-ratio:4/3;background:var(--line)}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:8px;inset-inline-start:8px;background:var(--brand);color:var(--brand-ink);font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:6px}
.mcount{position:absolute;bottom:8px;inset-inline-start:8px;display:flex;gap:6px}
.mcount span{background:rgba(0,0,0,.6);color:#fff;font-size:.74rem;padding:1px 7px;border-radius:6px;display:flex;align-items:center;gap:4px}
.fav{position:absolute;top:8px;inset-inline-end:8px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#444;cursor:pointer;display:grid;place-items:center}
.fav .ic{width:18px;height:18px}
.fav[aria-pressed="true"]{color:var(--heart)}
.fav[aria-pressed="true"] .ic{fill:currentColor}
.fav.inline{position:static;background:var(--surface);border:1px solid var(--line);color:var(--ink);width:38px;height:38px}
.fav.inline[aria-pressed="true"]{color:var(--heart)}
.cbody{padding:12px 14px 12px;display:flex;flex-direction:column;gap:5px;flex:1}
.price{font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums;line-height:1.3}
.price small{font-weight:500;font-size:.78rem;color:var(--muted)}
.card h3{font-size:.95rem;font-weight:600;margin:0}
.card h3 a::after{content:"";position:absolute;inset:0}
.loc{color:var(--muted);font-size:.84rem;margin:0;display:flex;align-items:center;gap:4px}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;list-style:none;margin:4px 0 0;padding:0;font-size:.86rem}
.specs li{display:flex;align-items:center;gap:5px}
.specs .ic{color:var(--muted)}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.ref{font-size:.8rem;color:var(--muted);direction:ltr}
.cfoot .wabtn{position:relative;z-index:2;padding:5px 12px;font-size:.84rem}
.pill{display:inline-block;font-size:.78rem;font-weight:600;padding:1px 9px;border-radius:6px;background:var(--good-bg);color:var(--good);white-space:nowrap}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.plain{background:var(--bg);color:var(--muted)}

/* detail */
.dhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 20px;margin-bottom:12px}
.dhead h1{font-size:1.3rem;font-weight:800;margin:0;line-height:1.4}
.dhead .acts{display:flex;gap:8px;align-items:center}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
@media (max-width:900px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.gal{position:relative;background:#000;border-radius:12px;overflow:hidden}
.stage{position:relative;aspect-ratio:4/3;max-height:560px;width:100%}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.gal .gnav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;cursor:pointer;font-size:1.1rem}
.gal .prev{inset-inline-start:10px}.gal .next{inset-inline-end:10px}
.gal .pos{position:absolute;bottom:10px;inset-inline-start:10px;background:rgba(0,0,0,.6);color:#fff;font-size:.78rem;padding:1px 9px;border-radius:6px;font-variant-numeric:tabular-nums}
.thumbs{display:flex;gap:6px;margin-top:6px;overflow-x:auto;padding-bottom:4px}
.thumbs button{position:relative;flex:0 0 76px;aspect-ratio:4/3;border-radius:6px;border:2px solid transparent;padding:0;cursor:pointer;overflow:hidden;background:#000}
.thumbs button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs button b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;background:rgba(0,0,0,.45)}
.thumbs button[aria-current="true"]{border-color:var(--brand)}
.note{font-size:.8rem;color:var(--muted);margin:4px 0 0}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.box h2{font-size:1rem;font-weight:800;margin:0 0 10px}
.box p{margin:0}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;gap:8px}
.strip div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.84rem;color:var(--muted)}
.strip .ic{width:22px;height:22px;color:var(--brand)}
.strip b{color:var(--ink);font-size:1rem}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem}
.tbl th{font-weight:500;color:var(--muted);text-align:start;padding:8px 10px;width:40%}
.tbl td{font-weight:600;padding:8px 10px}
.tbl tr:nth-child(odd){background:var(--bg)}
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 14px;list-style:none;margin:0;padding:0;font-size:.92rem}
.feats li{display:flex;align-items:center;gap:6px}
.feats .ic{color:var(--good)}
.side{position:sticky;top:72px}
.side .box{margin-top:0}
.side .price{font-size:1.5rem}
.side .btns{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.side .wabtn{padding:11px;font-size:1rem}
.btn2{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:10px;font-weight:600}
.btn2:hover{border-color:var(--brand);color:var(--brand)}
.qlinks{display:flex;flex-direction:column;gap:4px;margin-top:12px;font-size:.88rem}
.qlinks a{color:var(--brand)}
.agent{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.agent i{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-style:normal}
.agent b{display:block;color:var(--ink)}
.stick{display:none}

/* request form */
.req{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end}
.req .wide{grid-column:1/-1}
@media (max-width:760px){.req{grid-template-columns:1fr 1fr}}
.req .wabtn{grid-column:1/-1;justify-self:start;padding:10px 20px}

footer{background:var(--surface);border-top:1px solid var(--line);margin-top:36px;color:var(--muted);font-size:.88rem}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:20px 40px;padding-block:22px}
.foot p{margin:6px 0 0;max-width:40ch}
.foot nav{display:flex;flex-direction:column;gap:4px}
.foot nav a:hover{color:var(--brand)}
.foot h4{font-size:.85rem;color:var(--ink);margin:0 0 4px}
.legal{border-top:1px solid var(--line);padding-block:12px;font-size:.78rem}

/* phone: app tab bar */
.tabbar{display:none}
@media (max-width:760px){
  .nav,.callbtn{display:none}
  body{padding-bottom:62px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:.7rem;color:var(--muted);font-weight:600}
  .tabbar a .ic{width:22px;height:22px}
  .tabbar a[aria-current="page"]{color:var(--brand)}
  .tabbar a.wa{color:var(--wa)}
  body.on-detail .tabbar{display:none}
  .stick{display:flex;position:fixed;inset-inline:0;bottom:0;z-index:30;gap:8px;align-items:center;background:var(--surface);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
  .stick .price{flex:1;font-size:1rem}
  .stick .btn2{padding:8px 14px}
  .side{position:static}
  .strip b{font-size:.92rem}
  .grid{grid-template-columns:1fr}
  .dhead h1{font-size:1.1rem}
  .fbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .fbar select{flex:none}
  .fbar .sp{display:none}
}
@media (min-width:480px) and (max-width:760px){.grid{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
.sortbox{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.sortbox select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);font-weight:600}
.fpanel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-bottom:14px}
.fpanel summary{cursor:pointer;font-weight:700;padding:8px 0;list-style-position:inside}
.fpanel .cnt{background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:.75rem;padding:0 7px;margin-inline-start:4px}
.frow{display:flex;gap:12px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.frow:first-of-type{border-top:0}
.flabel{flex:0 0 76px;font-size:.84rem;color:var(--muted)}
.frow .chips{flex:1}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.clear{background:none;border:0;color:var(--brand);font-weight:600;padding:8px 0 10px;cursor:pointer}
@media (max-width:760px){.frow{flex-direction:column;align-items:stretch;gap:8px}.flabel{flex:none;font-weight:700;color:var(--ink)}}
/* swipeable photos */
.track{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.media{z-index:1}
.media .track{position:absolute;inset:0}
.media .track a{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:block}
.media .tag,.media .mcount{pointer-events:none;z-index:1}
.cpos{font-weight:500;font-variant-numeric:tabular-nums}
.cnav{position:absolute;top:50%;transform:translateY(-50%);z-index:1;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;cursor:pointer;font-size:1rem;line-height:1;opacity:0;transition:opacity .15s}
.cprev{left:8px}.cnext{right:8px}
.card:hover .cnav,.cnav:focus-visible{opacity:1}
@media (hover:none){.cnav{display:none}}
.gal .stage{position:relative;aspect-ratio:4/3;max-height:560px;width:100%}
.gal .slide{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
.gal .slide img,.gal .slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.gal .gnav{z-index:1}.gal .prev{left:10px;inset-inline-start:auto}.gal .next{right:10px;inset-inline-end:auto}
@media (max-width:760px){.gal .stage{aspect-ratio:3/4;max-height:70vh}}
@media (prefers-reduced-motion:reduce){.cnav{transition:none}}
/* ---- premium pass: calmer chrome, bigger photography, app-like flows */
body{font-size:15.5px;letter-spacing:.005em}
.top .wrap{height:62px}
.brand{font-size:1.3rem;letter-spacing:-.01em}
.nav a[aria-current="page"]{background:none;color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
.card{border:0;border-radius:16px;transition:transform .18s ease,box-shadow .18s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,26,33,.06),0 14px 34px rgba(20,26,33,.12)}
.media{aspect-ratio:5/4}
.tag{background:rgba(13,16,19,.72);color:#fff;backdrop-filter:blur(6px);font-weight:600;border-radius:999px;padding:3px 11px}
.cbody{padding:14px 16px 14px;gap:6px}
.price{font-size:1.25rem;letter-spacing:-.01em}
.card h3{font-weight:600;color:var(--ink)}
.cfoot{border-top-color:var(--line)}
.cfoot .wabtn{background:transparent;color:var(--wa);border:1px solid currentColor}
.cfoot .wabtn:hover{background:var(--wa);color:var(--wa-ink)}
.ref{letter-spacing:.04em}
.go,.wabtn,.btn2{border-radius:10px}
.box{border:0;border-radius:16px;box-shadow:var(--shadow);padding:20px}
.box h2{font-size:1.02rem}
.sec{margin:38px 0}
.sec-h h2{font-size:1.25rem;letter-spacing:-.01em}
.sec-h a{color:var(--ink);border-bottom:1px solid var(--accent);padding-bottom:1px}
.lhead h1,.dhead h1{letter-spacing:-.01em}
.strip .ic{color:var(--accent)}
.feats .ic{color:var(--accent)}
.side .price{font-size:1.7rem}
/* hero */
.hero{position:relative;margin:18px 0 0;border-radius:20px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;background:#12202c center/cover no-repeat;color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,16,.15),rgba(8,12,16,.78))}
.hero div{position:relative;padding:28px 28px 74px;max-width:640px}
.hero h1{font-size:clamp(1.6rem,4.2vw,2.4rem);font-weight:800;line-height:1.3;margin:0 0 6px;letter-spacing:-.015em;text-wrap:balance}
.hero p{margin:0;opacity:.88;font-size:1.02rem}
.search{position:relative;margin:-48px 18px 6px;border:0;border-radius:16px;box-shadow:0 10px 40px rgba(20,26,33,.16)}
.search h1{display:none}
.seg button[aria-pressed="true"]{color:var(--ink)}
.go{background:var(--brand);padding:11px 26px}
@media (max-width:760px){.hero{min-height:240px;border-radius:16px}.hero div{padding:20px 18px 66px}.search{margin:-44px 8px 6px;padding:14px}}
/* zone tiles */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.zone{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;background:#1a242d;color:#fff;text-align:start}
.zone img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.zone:hover img{transform:scale(1.05)}
.zone::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(8,12,16,.8))}
.zone span{position:absolute;inset-inline:12px;bottom:10px;z-index:1;font-weight:700;font-size:1rem;line-height:1.3}
.zone small{display:block;font-weight:400;opacity:.85;font-size:.78rem}
@media (max-width:760px){.zones{grid-auto-flow:column;grid-auto-columns:44%;grid-template-columns:none;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}}

    var rec = null, base = "";
    mic.addEventListener("click", function(){
      if (rec) { rec.stop(); return; }
      rec = new SR(); rec.lang = "ar-EG"; rec.interimResults = true; rec.continuous = true; base = box.value ? box.value + " " : "";
      rec.onresult = function(e){ var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; box.value = base + t; };
      rec.onerror = function(e){ note.textContent = e.error === "not-allowed" ? "المتصفح مانع الميكروفون. اسمحله من إعدادات الموقع، أو اكتب طلبك." : "ما قدرناش نسمعك كويس. جرّب تاني أو اكتب طلبك."; };
      rec.onend = function(){ rec = null; mic.setAttribute("aria-pressed", "false"); mic.lastChild.textContent = "اتكلم"; if (box.value.trim()) run(); };
      try { rec.start(); mic.setAttribute("aria-pressed", "true"); mic.lastChild.textContent = "بسمعك... دوس للإيقاف"; note.textContent = "اتكلم دلوقتي، ولما تخلص دوس على الزرار."; } catch (err) { rec = null; }
    });
  }
}

// ---- صفحة الشقة
function renderDetail(a){
  view = "detail"; current = a;
  var shots = a.imgs.map(function(src, i){ return {src:src, label:"صورة " + (i + 1)}; });
  if (a.video) shots.splice(1, 0, {video:a.video, src:a.imgs[0], label:"فيديو الشقة"});
  var at = 0;
  function tr(k, v){ return '<tr><th scope="row">' + k + '</th><td>' + v + '</td></tr>'; }
  var fin = [a.grade, a.finish === "new" ? "سكن أول" : a.finish === "used" ? "سكن تاني" : null].filter(Boolean).join("، ");
  var rows = tr("كود الشقة", '<span dir="ltr">' + a.code + '</span>') + tr("النوع", a.kind) + tr("العرض", DEAL[a.deal].name)
    + (fin ? tr("التشطيب", fin) : "") + (a.zone ? tr("المنطقة", a.zone) : "") + (a.gate ? tr("البوابة", a.gate) : "")
    + (a.floor !== null ? tr("الدور", FLOORS[a.floor] || a.floor) : "")
    + (a.deal === "sale" && a.area ? tr("سعر المتر", money(Math.round(a.price / a.area)) + " جنيه") : "") + tr("اتضافت", ago(daysOf(a)));
  var meters = a.meters.length
    ? a.meters.map(function(m){ return tr(m[0], '<span class="pill' + (m[2] === "warn" ? " warn" : "") + '">' + m[1] + '</span>'); }).join("")
    : tr("العدادات", '<span class="pill plain">اسأل عنها</span>');
  var similar = APTS.filter(function(x){ return x.deal === a.deal && x !== a; }).sort(function(x, y){
    var sx = (x.zone === a.zone ? 0 : 1), sy = (y.zone === a.zone ? 0 : 1);
    return sx - sy || Math.abs(x.price - a.price) - Math.abs(y.price - a.price);
  }).slice(0, 3);
  var contact = PHONE
    ? '<div class="btns"><a class="wabtn" href="' + waLink(a, INTENTS[0][1]) + '">' + ic("wa") + 'احجز معاينة على واتساب</a>'
      + '<a class="btn2" href="tel:' + PHONE + '">' + ic("phone") + '<span dir="ltr">' + PHONE + '</span></a></div>'
      + '<div class="qlinks"><a href="' + waLink(a, INTENTS[1][1]) + '">اسأل عن تفاصيل أكتر</a><a href="' + waLink(a, INTENTS[2][1]) + '">اسأل عن التفاوض في السعر</a></div>'
    : '<p class="note" style="margin-top:12px">رقم التواصل هيتضاف قريب. احفظ كود الشقة: ' + a.code + '</p>';
  document.getElementById("app").innerHTML =
    '<p class="crumbs"><a href="#home">الرئيسية</a> ‹ <a href="#' + a.deal + '">' + DEAL[a.deal].name + '</a> ‹ <span dir="ltr">' + a.code + '</span></p>'
    + '<div class="dhead"><div><h1>' + title(a) + '</h1><p class="loc">' + ic("pin") + place(a) + '</p></div><div class="acts"><button type="button" class="share" id="share">مشاركة</button>' + favBtn(a, true) + '</div></div>'
    + '<div class="dgrid"><div>'
    + '<div class="gal"><div class="track stage" id="stage" dir="ltr">' + shots.map(function(s){ return '<div class="slide">' + (s.video
      ? '<video src="' + s.video + '" poster="' + s.src + '" controls playsinline preload="none"></video>'
      : '<img src="' + s.src + '" alt="' + title(a) + '، ' + s.label + '" loading="lazy">') + '</div>'; }).join("") + '</div>'
    + '<button type="button" class="gnav prev" id="g-prev" aria-label="اللي قبلها">‹</button>'
    + '<button type="button" class="gnav next" id="g-next" aria-label="اللي بعدها">›</button>'
    + '<span class="pos" id="g-pos" dir="ltr"></span><button type="button" class="zoom" id="g-zoom">تكبير</button></div>'
    + '<div class="thumbs" id="thumbs">' + shots.map(function(s, i){ return '<button type="button" data-i="' + i + '" aria-label="' + s.label + '"><img src="' + s.src + '" alt="" loading="lazy">' + (s.video ? '<b>' + ic("play") + '</b>' : '') + '</button>'; }).join("") + '</div>'
    + (a.framed ? '<p class="note">الصور دي لقطات من فيديو الشقة.</p>' : '')
    + '<div class="box"><div class="strip"><div>' + ic("area") + '<b>' + (a.area ? a.area + ' م²' : "—") + '</b>المساحة</div><div>' + ic("bed") + '<b>' + (a.rooms || "—") + '</b>غرف</div><div>' + ic("bath") + '<b>' + (a.baths || "—") + '</b>حمام</div><div>' + ic("floor") + '<b>' + (a.floor === null ? "—" : a.floor === 0 ? "أرضي" : a.floor) + '</b>الدور</div></div></div>'
    + (a.desc ? '<div class="box"><h2>الوصف</h2><p>' + a.desc + '</p></div>' : '')
    + '<div class="box"><h2>التفاصيل</h2><table class="tbl"><tbody>' + rows + '</tbody></table></div>'
    + '<div class="box"><h2>العدادات والنت</h2><table class="tbl"><tbody>' + meters + '</tbody></table></div>'
    + (a.feats.length ? '<div class="box"><h2>المميزات</h2><ul class="feats">' + a.feats.map(function(f){ return '<li>' + ic("check") + f + '</li>'; }).join("") + '</ul></div>' : '')
    + '</div>'
    + '<aside class="side"><div class="box"><div class="price">' + priceHtml(a) + '</div>' + (a.pnote ? '<p class="note">' + a.pnote + '</p>' : '')
    + contact
    + '<div class="agent"><i>' + ic("phone") + '</i><span><b>' + (SITE.name || "") + '</b>اذكر الكود <span dir="ltr">' + a.code + '</span> لما تكلمنا</span></div>'
    + '</div></aside></div>'
    + (similar.length ? '<section class="sec"><div class="sec-h"><h2>شقق مشابهة</h2></div><div class="grid">' + similar.map(cardHtml).join("") + '</div></section>' : '')
    + (PHONE ? '<div class="stick"><div class="price">' + priceHtml(a) + '</div><a class="btn2" href="tel:' + PHONE + '" aria-label="اتصال">' + ic("phone") + '</a><a class="wabtn" href="' + waLink(a, INTENTS[0][1]) + '">' + ic("wa") + 'واتساب</a></div>' : '');
  var stage = document.getElementById("stage");
  function mark(i){
    at = i;
    document.getElementById("g-pos").textContent = (at + 1) + " / " + shots.length;
    Array.prototype.forEach.call(document.getElementById("thumbs").children, function(c, k){ if (k === at) c.setAttribute("aria-current", "true"); else c.removeAttribute("aria-current"); });
    var th = document.getElementById("thumbs").children[at]; if (th && th.scrollIntoView) th.scrollIntoView({block:"nearest", inline:"nearest"});
    Array.prototype.forEach.call(stage.querySelectorAll("video"), function(v){ if (v.closest(".slide") !== stage.children[at]) v.pause(); });
  }
  function show(i){ i = (i + shots.length) % shots.length; stage.scrollTo({left:i * stage.clientWidth, behavior:"smooth"}); }
  stage.addEventListener("scroll", function(){ var i = Math.round(stage.scrollLeft / stage.clientWidth); if (i !== at && i >= 0 && i < shots.length) mark(i); });
  document.getElementById("thumbs").addEventListener("click", function(e){ var b = e.target.closest("button"); if (b) show(+b.dataset.i); });
  var want = 0;
  document.getElementById("g-prev").addEventListener("click", function(){ want = (want - 1 + shots.length) % shots.length; show(want); });
  document.getElementById("g-next").addEventListener("click", function(){ want = (want + 1) % shots.length; show(want); });
  stage.addEventListener("scrollend", function(){ want = at; });
  function full(on){
    var keep = at; document.body.classList.toggle("full", on);
    document.getElementById("g-zoom").textContent = on ? "قفل ×" : "تكبير";
    stage.scrollTo({left:keep * stage.clientWidth}); want = keep;
  }
  document.getElementById("g-zoom").addEventListener("click", function(){ full(!document.body.classList.contains("full")); });
  stage.addEventListener("click", function(e){ if (e.target.tagName === "IMG") full(!document.body.classList.contains("full")); });
  document.getElementById("share").addEventListener("click", function(){
    var btn = this, url = location.href, done = function(){ btn.textContent = "اتنسخ اللينك"; setTimeout(function(){ btn.textContent = "مشاركة"; }, 2000); };
    if (navigator.share) navigator.share({title:plain(title(a)) + " | " + plain(SITE.name || ""), url:url}).catch(function(){});
    else if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function(){});
  });
  if (shots.length) mark(0);
}

document.getElementById("app").addEventListener("click", function(e){
  var b = e.target.closest("[data-fav]"); if (!b) return;
  e.preventDefault(); toggleFav(b.dataset.fav);
  if (view === "saved") { renderSaved(); return; }
  var on = !!favs[b.dataset.fav];
  Array.prototype.forEach.call(document.querySelectorAll('[data-fav="' + b.dataset.fav + '"]'), function(x){
    x.setAttribute("aria-pressed", on); x.setAttribute("aria-label", on ? "شيل من المحفوظة" : "احفظ الشقة");
  });
});

document.getElementById("app").addEventListener("scroll", function(e){
  var t = e.target; if (!t.classList || !t.classList.contains("track") || t.id === "stage") return;
  var p = t.parentNode.querySelector(".cpos"); if (p) p.textContent = (Math.round(t.scrollLeft / t.clientWidth) + 1) + " / " + t.children.length;
}, true);
document.getElementById("app").addEventListener("click", function(e){
  var b = e.target.closest("[data-cnav]"); if (!b) return;
  e.preventDefault(); var t = b.parentNode.querySelector(".track"); t.scrollBy({left:(+b.dataset.cnav) * t.clientWidth, behavior:"smooth"});
});
var memo = {}, lastHash = null, lastView = null;
document.addEventListener("keydown", function(e){ if (e.key === "Escape") document.body.classList.remove("full", "sheet"); });

// ---- Meta Pixel events
function px(){ if (window.fbq) try { fbq.apply(null, arguments); } catch(e){} }
function aptParams(a){ return a ? {content_ids:[a.code], content_type:"home_listing", content_name:title(a), content_category:DEAL[a.deal].name, deal:a.deal, zone:a.zone || "", value:a.price, currency:"EGP"} : {}; }
function aptFromHref(href){
  var t = ""; try { t = decodeURIComponent((href.split("text=")[1] || "")); } catch(e){}
  var hit = APTS.filter(function(x){ return t.indexOf(x.code) !== -1; })[0];
  if (hit) return hit;
  var h = location.hash.replace("#", "");
  return APTS.filter(function(x){ return slug(x) === h; })[0] || null;
}
var LEADS_URL = "https://script.google.com/macros/s/AKfycbxedFzuNzc2LhS7mqRC06kSxS1MazleYkSlidQE2JXj1IwR4ZEbZ9XqC7eVkeXtBsTJ/exec"; // رابط Google Apps Script (Web app)
function leadSaved(){ try { return JSON.parse(localStorage.getItem("aq_who") || "{}"); } catch(e){ return {}; } }
function leadForm(href, a, placement){
  var m = document.getElementById("lm");
  if (!m) {
    m = document.createElement("div"); m.id = "lm"; m.className = "lm"; m.hidden = true;
    m.innerHTML = '<div class="lbox" role="dialog" aria-modal="true" aria-labelledby="lm-h"><button type="button" class="lx" aria-label="إغلاق">×</button>'
      + '<h2 id="lm-h">سجّل رقمك وهنكلمك على واتساب</h2><p id="lm-sub">خدمة العملاء هتتواصل معاك في أسرع وقت.</p>'
      + '<form id="lm-f" novalidate><label>الاسم<input id="lm-n" autocomplete="name" required></label>'
      + '<label>رقم الواتساب<input id="lm-p" type="tel" inputmode="numeric" dir="ltr" placeholder="01xxxxxxxxx" autocomplete="tel" required></label>'
      + '<p class="lerr" id="lm-e"></p><button type="submit" class="wabtn">' + ic("wa") + 'سجّل رقمي</button></form>'
      + '<div id="lm-ok" hidden><h2>تمام، استلمنا رقمك ✓</h2><p>هنكلمك على واتساب قريب جدًا.</p><a class="wabtn" id="lm-go" target="_blank" rel="noopener">' + ic("wa") + 'أو كلّمنا إنت دلوقتي</a></div></div>';
    document.body.appendChild(m);
    m.addEventListener("click", function(e){ if (e.target === m || e.target.classList.contains("lx")) m.hidden = true; });
    document.addEventListener("keydown", function(e){ if (e.key === "Escape") m.hidden = true; });
  }
  var f = document.getElementById("lm-f"), ok = document.getElementById("lm-ok");
  f.hidden = false; ok.hidden = true; document.getElementById("lm-e").textContent = "";
  document.getElementById("lm-sub").textContent = a ? "على شقة " + a.code + " (" + DEAL[a.deal].name + ")، خدمة العملاء هتتواصل معاك في أسرع وقت." : "خدمة العملاء هتتواصل معاك في أسرع وقت.";
  document.getElementById("lm-go").href = href;
  f.onsubmit = function(e){
    e.preventDefault();
    var name = document.getElementById("lm-n").value.trim();
    var ph = document.getElementById("lm-p").value.replace(/[٠-٩]/g, function(d){ return "٠١٢٣٤٥٦٧٨٩".indexOf(d); }).replace(/[^0-9]/g, "");
    if (ph.indexOf("20") === 0) ph = "0" + ph.slice(2);
    if (!name) { document.getElementById("lm-e").textContent = "اكتب اسمك."; return; }
    if (!/^01[0125][0-9]{8}$/.test(ph)) { document.getElementById("lm-e").textContent = "اكتب رقم موبايل مصري صحيح، 11 رقم يبدأ بـ 01."; return; }
    var p = aptParams(a), id = "L" + Date.now() + Math.random().toString(36).slice(2, 6);
    p.placement = placement;
    px("track", "Lead", p, {eventID:id});
    var row = {id:id, name:name, phone:ph, code:a ? a.code : "", deal:a ? DEAL[a.deal].name : "", title:a ? title(a) : "", price:a ? a.price : "",
               zone:a ? (a.zone || "") : "", placement:placement, page:location.href};
    if (LEADS_URL) try { fetch(LEADS_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(row)}); } catch(err){}
    try { localStorage.setItem("aq_who", JSON.stringify({name:name, phone:ph})); } catch(err){}
    var go = document.getElementById("lm-go"), base = href.split("?text=");
    var txt = ""; try { txt = decodeURIComponent(base[1] || ""); } catch(err){}
    go.href = base[0] + "?text=" + encodeURIComponent(txt + (txt ? "\n\n" : "") + "الاسم: " + name + "\nرقم الواتساب: " + ph);
    f.hidden = true; ok.hidden = false;
  };
  var who = leadSaved(); document.getElementById("lm-n").value = who.name || ""; document.getElementById("lm-p").value = who.phone || "";
  m.hidden = false; setTimeout(function(){ document.getElementById(who.name ? "lm-p" : "lm-n").focus(); }, 50);
}
document.addEventListener("click", function(e){
  var l = e.target.closest && e.target.closest("a[href]"); if (!l) return;
  var href = l.getAttribute("href") || "";
  if (l.id === "lm-go") { px("trackCustom", "WhatsAppClick", {placement:"after_lead"}); return; }
  if (href.indexOf("wa.me/") !== -1) {
    var a = aptFromHref(href), p = aptParams(a);
    p.placement = l.id || (l.closest(".helpbox,#h-out") ? "help" : l.closest(".stick") ? "sticky" : location.hash.replace("#", "") || "home");
    px("trackCustom", "WhatsAppClick", p);
    e.preventDefault(); leadForm(href, a, p.placement);
  } else if (href.indexOf("tel:") === 0) {
    px("trackCustom", "PhoneClick", aptParams(aptFromHref("")));
  }
}, true);
function route(){
  var h = location.hash.replace("#", "");
  if (lastHash !== null) memo[lastHash] = window.scrollY;
  var back = lastView === "detail" && memo[h] !== undefined ? memo[h] : 0;
  document.body.classList.remove("full", "sheet");
  var a = APTS.filter(function(x){ return slug(x) === h; })[0];
  document.body.classList.toggle("on-detail", !!a);
  if (a) { renderDetail(a); window.scrollTo(0, 0); px("track", "ViewContent", aptParams(a)); }
  else if (h === "rent" || h === "sale") {
    if (!((keep || lastView === "detail") && state.deal === h)) state = fresh(h);
    keep = false; renderList(); window.scrollTo(0, back);
  }
  else if (h === "saved") { renderSaved(); window.scrollTo(0, back); }
  else if (h === "help") { renderHelp(); window.scrollTo(0, 0); }
  else {
    renderHome();
    if (h === "contact") { var c = document.getElementById("contact"); if (c) c.scrollIntoView(); } else window.scrollTo(0, back);
  }
  lastHash = h; lastView = view;
  var nav = a ? a.deal : (h === "rent" || h === "sale" || h === "saved" || h === "help") ? h : "home";
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"), function(l){
    if (l.dataset.nav === nav) l.setAttribute("aria-current", "page"); else l.removeAttribute("aria-current");
  });
}
function boot(data){
  data = escAll(data);
  SITE = data.site || {}; if (SITE.leadsUrl) LEADS_URL = SITE.leadsUrl; PHONE = (SITE.phone || "").replace(/[^0-9]/g, ""); if (PHONE.indexOf("20") === 0) PHONE = "0" + PHONE.slice(2); WA = "2" + PHONE;
  APTS = (data.listings || []).filter(function(a){ return !a.hidden; });
  APTS.forEach(function(a){ a.imgs = a.imgs || []; a.feats = a.feats || []; a.meters = a.meters || []; if (a.floor === undefined) a.floor = null; });
  document.title = (SITE.name || "") + " | شقق إيجار وتمليك في حدايق الأهرام";
  Array.prototype.forEach.call(document.querySelectorAll(".bname"), function(l){ l.innerHTML = SITE.name || ""; });
  document.getElementById("footText").innerHTML = SITE.footerText || "";
  document.getElementById("legal").innerHTML = "© " + new Date().getFullYear() + " " + (SITE.name || "");
  var n = document.getElementById("notice"); if (SITE.notice) { n.innerHTML = SITE.notice; n.hidden = false; }
  ["callTop","callFoot"].forEach(function(id){ var e = document.getElementById(id); e.hidden = !PHONE; if (PHONE) { e.href = "tel:" + PHONE; e.innerHTML = (id === "callTop" ? ic("phone") : "") + PHONE; } });
  ["waTop","waFoot","support"].forEach(function(id){ var e = document.getElementById(id); if (PHONE) { e.href = waLink(null); e.hidden = false; } else if (id !== "waFoot") e.hidden = true; });
  var nr = APTS.filter(function(a){ return a.deal === "rent"; }).length;
  state = fresh(nr * 2 >= APTS.length ? "rent" : "sale");
  window.addEventListener("hashchange", route);
  route();
}
fetch("data.json?v=" + Date.now()).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).then(boot).catch(function(){
  document.getElementById("app").innerHTML = '<div class="empty" style="margin:40px 0">الصفحة مش قادرة تحمّل بيانات الشقق دلوقتي. جرّب تعمل تحديث للصفحة.</div>';
});
</script>
</body>
